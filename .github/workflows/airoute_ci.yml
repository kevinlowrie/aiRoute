name: aiRoute CI

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true  # repo may not have a requirements file
      - name: Lint scripts
        run: |
          # Simple flake8 lint, adjust as needed
          pip install flake8
          flake8 scripts/ad-hoc/*.py
      - name: Run aiRoute gateway unit test
        env:
          FIREBASE_PROJECT: test-project
          LITELLM_API_KEY: dummy-key
          CDN_IMAGE_BASE: https://cdn.example.com/thl-pclipd-api
        run: |
          python -m unittest discover -s tests/integration -p "test_airoute.py" || true
      - name: Verify Podman can run a dummy container
        run: |
          podman run --rm alpine echo hello
