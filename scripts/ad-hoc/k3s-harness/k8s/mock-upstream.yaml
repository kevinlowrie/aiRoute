# In-cluster fake OpenAI-compatible upstream for the harness drills.
#
# Deploy with k8s/deploy-mock.sh, which creates the ConfigMap from
# ../mock-upstream.mjs. Lab use only: /__control is unauthenticated, so do not
# put an Ingress or a LoadBalancer in front of this Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-mock-upstream
  labels:
    app.kubernetes.io/name: harness-mock-upstream
    app.kubernetes.io/part-of: omniroute-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-mock-upstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-mock-upstream
        app.kubernetes.io/part-of: omniroute-harness
    spec:
      securityContext:
        runAsNonRoot: true
        # 1000 = the `node` user in the official Node image.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: node:22.23.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["node", "/harness/mock-upstream.mjs"]
          env:
            - name: MOCK_HOST
              value: "0.0.0.0"
            - name: MOCK_PORT
              value: "9100"
            - name: MOCK_LATENCY_MS
              value: "50"
          ports:
            - name: http
              containerPort: 9100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /__health
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /harness
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: harness-mock-upstream
---
apiVersion: v1
kind: Service
metadata:
  name: harness-mock-upstream
  labels:
    app.kubernetes.io/name: harness-mock-upstream
    app.kubernetes.io/part-of: omniroute-harness
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: harness-mock-upstream
  ports:
    - name: http
      port: 9100
      targetPort: http
      protocol: TCP
